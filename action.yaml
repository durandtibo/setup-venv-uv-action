name: "Setup venv with uv"
description: "Setup a Python virtual environment and install the project dependencies using uv"

author: "Thibaut Durand"

branding:
  icon: "layers"
  color: "blue"

inputs:
  python-version:
    default: "3.14"
    description: "Python version to use (e.g., '3.13', '3.12', '3.11', '3.10') or any version request supported by uv (e.g., '>=3.12,<3.14'). Defaults to Python 3.14."
    required: false
  uv-version:
    default: ""
    description: "Version of uv to install (e.g., '0.9.0', '0.9.x', '>=0.9,<0.10' or 'latest'). Leave empty to use the 'required-version' of the project ('uv.toml' or 'pyproject.toml') if any, and the latest version otherwise."
    required: false
  package-name:
    default: ""
    description: "Optional package name to install for dependency compatibility testing. Use with 'package-version' to test specific versions. Leave empty to skip."
    required: false
  package-version:
    default: ""
    description: "Optional package version to install (e.g., '1.0.0'). Only used when 'package-name' is specified. Leave empty to install the latest version."
    required: false
  install-args:
    default: ""
    description: "Optional arguments passed to the 'inv env.install' command (e.g., '--no-optional-deps', '--groups=dev,docs', or custom flags supported by your invoke-tasklib configuration). The value is split on whitespace: quotes are not interpreted and glob characters are kept as is."
    required: false
  package-install-args:
    default: ""
    description: "Optional arguments passed to the 'uv pip install' command used to install 'package-name' (e.g., '--upgrade')."
    required: false
  invoke-tasklib-version:
    default: ">=0.0.8,<1.0.0"
    description: "Version specifier of 'invoke-tasklib' installed before running the project tasks (e.g., '>=0.0.8,<1.0.0', '==0.0.8'). It must be a valid PEP 440 specifier, including the operator."
    required: false
  extra-packages:
    default: ""
    description: "Optional additional packages to install after the project dependencies, one requirement per line (e.g., 'pytest-xdist' or 'requests>=2.31'). Leave empty to skip."
    required: false
  enable-cache:
    default: "auto"
    description: "Enable the GitHub Actions cache of uv ('true', 'false' or 'auto'). 'auto' (default) enables the cache on GitHub-hosted runners and disables it elsewhere, like astral-sh/setup-uv. The cache is keyed on the lock files of the project."
    required: false
  working-directory:
    default: "."
    description: "Directory that contains the project ('pyproject.toml', 'tasks.py', 'invoke.yaml'), relative to the workspace. Use it for repositories where the Python project is in a subfolder."
    required: false
  verbose:
    default: "true"
    description: "Run the diagnostic steps that show the Python configuration, the installed packages, the dependency tree and the environment check ('true' or 'false'). Set it to 'false' for quieter logs. Defaults to 'true'."
    required: false
  uv-no-progress:
    default: "true"
    description: "Disable uv progress bars ('true' or 'false'). Defaults to 'true'."
    required: false

outputs:
  cache-hit:
    description: "Whether the uv cache was restored ('true' or 'false'). Empty when the cache is disabled."
    value: ${{ steps.setup-uv.outputs.cache-hit }}
  uv-version:
    description: "Version of uv that was installed (e.g., '0.9.0'). Useful when 'uv-version' is empty or a range."
    value: ${{ steps.setup-uv.outputs.uv-version }}
  python-version:
    description: "Full version of the Python interpreter of the environment (e.g., '3.14.0')."
    value: ${{ steps.python-version.outputs.python-version }}

runs:
  using: "composite"
  steps:
    # Step 1: Validate the inputs
    # Runs first so that an invalid value fails immediately with a clear message
    # - The boolean-like inputs must be 'true' or 'false' ('auto' is also accepted by enable-cache)
    # - working-directory must be an existing directory inside the workspace
    # - invoke-tasklib-version must be a version specifier that starts with an
    #   operator (an empty value is accepted: the latest version is installed)
    # - package-name must be a package name, optionally followed by extras
    #   (e.g., 'numpy' or 'uvicorn[standard]'), not an option or a requirement
    # - package-version and package-install-args are ignored without package-name: warn
    # - An empty python-version is valid (uv uses the version of the project): notice
    - name: Validate inputs
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        PACKAGE_INSTALL_ARGS: ${{ inputs.package-install-args }}
        ENABLE_CACHE: ${{ inputs.enable-cache }}
        VERBOSE: ${{ inputs.verbose }}
        UV_NO_PROGRESS_INPUT: ${{ inputs.uv-no-progress }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        TASKLIB_VERSION: ${{ inputs.invoke-tasklib-version }}
      run: |
        status=0
        check_boolean() {
          if [ "$2" != "true" ] && [ "$2" != "false" ]; then
            echo "::error title=Invalid input::The input '$1' must be 'true' or 'false', got '$2'."
            status=1
          fi
        }
        check_boolean uv-no-progress "${UV_NO_PROGRESS_INPUT}"
        check_boolean verbose "${VERBOSE}"
        if [ "${ENABLE_CACHE}" != "auto" ]; then
          check_boolean enable-cache "${ENABLE_CACHE}"
        fi
        absolute_path='^(/|\\|[A-Za-z]:)'
        parent_path='(^|[/\\])\.\.([/\\]|$)'
        if [[ "${WORKING_DIRECTORY}" =~ ${absolute_path} ]]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "must be relative to the workspace, got '${WORKING_DIRECTORY}'."
          status=1
        elif [[ "${WORKING_DIRECTORY}" =~ ${parent_path} ]]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "must stay inside the workspace, got '${WORKING_DIRECTORY}'."
          status=1
        elif [ ! -d "${GITHUB_WORKSPACE}/${WORKING_DIRECTORY}" ]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "is not a directory of the workspace: '${WORKING_DIRECTORY}'." \
            "Did you forget the 'actions/checkout' step?"
          status=1
        fi
        # Shape check of a PEP 440 specifier set: comma-separated clauses, each
        # one an operator followed by a version (e.g., '>=0.0.8,<1.0.0')
        space='[[:space:]]*'
        operator='(===|==|!=|~=|<=|>=|<|>)'
        version='v?[0-9][0-9A-Za-z.!+*_-]*'
        clause="${space}${operator}${space}${version}${space}"
        specifier="^(${clause}(,${clause})*)?\$"
        if ! [[ "${TASKLIB_VERSION}" =~ ${specifier} ]]; then
          echo "::error title=Invalid input::The input" \
            "'invoke-tasklib-version' must be a version specifier that" \
            "starts with an operator (e.g., '>=0.0.8,<1.0.0' or '==0.0.8')," \
            "got '${TASKLIB_VERSION}'."
          status=1
        fi
        distribution='[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?'
        extras='(\[[A-Za-z0-9._,-]+\])?'
        package_name="^${distribution}${extras}\$"
        if [ -n "${PACKAGE_NAME}" ] &&
          ! [[ "${PACKAGE_NAME}" =~ ${package_name} ]]; then
          echo "::error title=Invalid input::The input 'package-name' must be" \
            "a package name, optionally followed by extras (e.g., 'numpy' or" \
            "'uvicorn[standard]'), got '${PACKAGE_NAME}'. The version goes in" \
            "'package-version' and the options in 'package-install-args'."
          status=1
        fi
        if [ -z "${PACKAGE_NAME}" ] && [ -n "${PACKAGE_VERSION}" ]; then
          echo "::warning title=Ignored input::The input 'package-version' is ignored because 'package-name' is empty."
        fi
        if [ -z "${PACKAGE_NAME}" ] && [ -n "${PACKAGE_INSTALL_ARGS}" ]; then
          echo "::warning title=Ignored input::The input 'package-install-args' is ignored because 'package-name' is empty."
        fi
        if [ -z "${PYTHON_VERSION}" ]; then
          echo "::notice title=Empty python-version::The input 'python-version' is empty: uv selects the Python version of the project."
        fi
        exit "${status}"

    # Step 2: Install uv and configure the Python environment
    # Uses the astral-sh/setup-uv action which:
    # - Installs uv (ultra-fast Python package installer and resolver), in the
    #   version of the uv-version input
    # - Sets up the specified Python version
    # - Activates the virtual environment so subsequent steps can use 'python' and 'uv pip'
    # - Restores and saves the uv cache when the enable-cache input allows it
    # The project files are searched in the working-directory input
    - name: Install uv and set the python version
      id: setup-uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        enable-cache: ${{ inputs.enable-cache }}
        activate-environment: true

    # Step 3: Verify that uv and python are available in PATH
    # Safety check to ensure the environment setup succeeded
    # Outputs the full paths to both executables for debugging
    - name: Verify uv and python installation
      shell: bash
      run: |
        which uv
        which python

    # Step 4: Install invoke-tasklib
    # invoke-tasklib provides the shared invoke tasks used below
    # (env.install, env.show-python-config, env.show-installed-packages)
    # The version specifier is set with the invoke-tasklib-version input
    - name: Install invoke-tasklib
      shell: bash
      env:
        TASKLIB_VERSION: ${{ inputs.invoke-tasklib-version }}
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        uv pip install "invoke-tasklib${TASKLIB_VERSION}"

    # Step 5: Verify that the project defines the invoke tasks used by this action
    # Fails early with a clear message when 'tasks.py' or the 'env.install' task is
    # missing, instead of an obscure error from 'inv' in the next step
    # A missing show task only emits a warning because these tasks are optional
    - name: Verify project tasks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ ! -f tasks.py ]; then
          echo "::error title=Missing tasks.py::No 'tasks.py' found in '$(pwd)'. It must expose the invoke-tasklib task collection (see the README)."
          exit 1
        fi
        if ! tasks=$(inv --list 2>&1); then
          echo "${tasks}"
          echo "::error title=Invalid tasks.py::'inv --list' failed in '$(pwd)'. Check that 'tasks.py' and 'invoke.yaml' are valid."
          exit 1
        fi
        echo "${tasks}"
        # Match whole task names only, so that 'env.show-python-config-extra' is
        # not mistaken for 'env.show-python-config'
        has_task() {
          grep -qE "(^|[[:space:]])${1//./[.]}([[:space:]]|\$)" <<< "${tasks}"
        }
        if ! has_task env.install; then
          echo "::error title=Missing env.install task::The 'env.install' task is not defined in 'tasks.py'. Expose the invoke-tasklib collection: 'from invoke_tasklib import ns'."
          exit 1
        fi
        for task in env.show-python-config env.show-installed-packages; do
          if ! has_task "${task}"; then
            echo "::warning title=Missing ${task} task::The '${task}' task is not defined; the corresponding diagnostic step will fail."
          fi
        done

    # Step 6: Install project dependencies using the env.install task
    # The task is executed in the working-directory input
    # Optional install-args can be passed to customize the installation
    # (e.g., --no-optional-deps to skip installing optional dependencies)
    # The arguments are split on whitespace (no quoting) and are not glob-expanded
    # 'uv sync --frozen' removes the packages that are not in the lock file, so
    # invoke-tasklib (installed in step 4) is removed when the project does not
    # depend on it: warn, because the diagnostic steps need it
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
        VERBOSE: ${{ inputs.verbose }}
      run: |
        # install-args is split on whitespace but not expanded as a glob
        set -f
        inv env.install ${INSTALL_ARGS}
        set +f
        if [ "${VERBOSE}" = "true" ] &&
          ! uv pip show --quiet invoke-tasklib; then
          echo "::warning title=invoke-tasklib removed::'invoke-tasklib' was" \
            "removed from the environment because it is not a dependency of" \
            "the project, so the diagnostic steps will fail. Add it to the" \
            "project dependencies (see the README)."
        fi

    # Step 7 (Optional): Install a specific package version for compatibility testing
    # Only runs if package-name is provided
    # Useful for testing your project against different versions of a dependency
    # (e.g., test against numpy 1.24.0, 1.25.0, etc. in a matrix strategy)
    # The python-version input is not forwarded: uv-install-package-action only
    # accepts 'X.Y' versions, whereas python-version can be any uv version
    # request (e.g., '>=3.12'). It detects the version of the active interpreter
    - name: Install specific package version
      if: ${{ inputs.package-name != '' }}
      uses: durandtibo/uv-install-package-action@fe64eac38f69e851b5e79b74ee255ed95a159bc0 # ratchet:durandtibo/uv-install-package-action@v0.2.0
      with:
        package-name: ${{ inputs.package-name }}
        package-version: ${{ inputs.package-version }}
        uv-args: ${{ inputs.package-install-args }}
      env:
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}

    # Step 8 (Optional): Install additional packages
    # Only runs if extra-packages is provided, with one requirement per line
    # Useful for tools that are not dependencies of the project (e.g., pytest-xdist)
    # Blank lines are ignored and every line is passed to uv as a single argument
    - name: Install extra packages
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        packages=()
        while IFS= read -r line; do
          # Trim the leading and trailing whitespace without spawning a process
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          if [ -n "${line}" ]; then
            packages+=("${line}")
          fi
        done <<< "${EXTRA_PACKAGES}"
        if [ "${#packages[@]}" -gt 0 ]; then
          uv pip install "${packages[@]}"
        fi

    # Steps 9 to 12 are diagnostic steps: they are skipped when verbose is 'false'
    # Like every step that runs uv, they receive UV_NO_PROGRESS (uv-no-progress)
    # Step 9: Display the Python configuration for debugging and verification
    # The task is executed in the working-directory input
    # Useful for troubleshooting version-related issues
    # Uses continue-on-error so a reporting failure does not fail the workflow
    - name: Show python config
      if: ${{ inputs.verbose == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        inv env.show-python-config

    # Step 10: Display all installed packages with their versions
    # Provides a complete inventory of the Python environment
    # Helpful for debugging dependency issues and verifying installations
    # Uses continue-on-error so a reporting failure does not fail the workflow
    - name: Show installed packages
      if: ${{ inputs.verbose == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        inv env.show-installed-packages

    # Step 11: Display the dependency tree with version constraints
    # Shows the full dependency graph including:
    # - Direct dependencies
    # - Transitive (indirect) dependencies
    # - Version specifiers (e.g., >=1.0.0, <2.0)
    # Useful for understanding dependency relationships and conflicts
    # Uses continue-on-error so a reporting failure does not fail the workflow
    - name: Show dependency tree
      if: ${{ inputs.verbose == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        uv pip tree --show-version-specifiers

    # Step 12: Verify environment integrity
    # Runs 'uv pip check' to detect:
    # - Missing dependencies
    # - Version conflicts
    # - Broken installations
    # Uses continue-on-error so the workflow continues even with conflicts
    # (conflicts are logged for debugging but don't fail the build)
    - name: Verify the current environment
      if: ${{ inputs.verbose == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        uv pip check

    # Step 13: Set the outputs of the action
    # Reads the version from the interpreter that is active at the end of the
    # action (after the dependencies are installed), not from the requested input
    # 'uv python find' returns the interpreter of the active virtual environment,
    # and the version is read before writing the output so that a failure fails
    # the step instead of silently setting an empty output
    # It runs in the working-directory input, like the other steps that use uv,
    # so that the interpreter is found in the same project as the install
    - name: Set outputs
      id: python-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UV_NO_PROGRESS: ${{ inputs.uv-no-progress }}
      run: |
        python_bin="$(uv python find)"
        python_version="$("${python_bin}" -c 'import platform; print(platform.python_version())')"
        echo "python-version=${python_version}" >> "${GITHUB_OUTPUT}"
