name: "Setup venv with uv"
description: "Setup a Python virtual environment and install the project dependencies using uv"

author: "Thibaut Durand"

branding:
  icon: "layers"
  color: "blue"

inputs:
  python-version:
    default: ""
    description: "Python version to use (e.g., '3.13', '3.12', '3.11', '3.10') or any version request supported by uv (e.g., '>=3.12,<3.14'). Leave empty to let uv select the version of the project ('.python-version', then 'requires-python' of 'pyproject.toml')."
    required: false
  uv-version:
    default: ""
    description: "Version of uv to install (e.g., '0.9.0', '0.9.x', '>=0.9,<0.10' or 'latest'). Leave empty to use the 'required-version' of the project ('uv.toml' or 'pyproject.toml') if any, and the latest version otherwise."
    required: false
  install-args:
    default: ""
    description: "Optional arguments passed to the 'inv env.install' command (e.g., '--no-optional-deps', '--groups=dev,docs', or custom flags supported by your invoke-tasklib configuration). The value is split on whitespace: quotes are not interpreted and glob characters are kept as is."
    required: false
  extra-packages:
    default: ""
    description: "Optional additional packages to install after the project dependencies, one requirement per line (e.g., 'pytest-xdist', 'numpy==1.26.0' or 'requests[socks]>=2.31'). Use it to test a specific version of a dependency. A line cannot be an option: it must not start with '-'. Leave empty to skip."
    required: false
  enable-cache:
    default: "auto"
    description: "Enable the GitHub Actions cache of uv ('true', 'false' or 'auto'). 'auto' (default) enables the cache on GitHub-hosted runners and disables it elsewhere, like astral-sh/setup-uv. The cache is keyed on the lock files of the project."
    required: false
  working-directory:
    default: "."
    description: "Directory that contains the project ('pyproject.toml', 'uv.lock', 'tasks.py', 'invoke.yaml'), relative to the workspace. Use it for repositories where the Python project is in a subfolder."
    required: false

outputs:
  cache-hit:
    description: "Whether the uv cache was restored ('true' or 'false'). Empty when the cache is disabled."
    value: ${{ steps.setup-uv.outputs.cache-hit }}
  uv-version:
    description: "Version of uv that was installed (e.g., '0.9.0'). Useful when 'uv-version' is empty or a range."
    value: ${{ steps.setup-uv.outputs.uv-version }}
  python-version:
    description: "Full version of the Python interpreter of the environment (e.g., '3.14.0')."
    value: ${{ steps.python-version.outputs.python-version }}

runs:
  using: "composite"
  steps:
    # Step 1.1: Validate enable-cache
    # Steps 1.1 to 1.4 validate the inputs and the project files before anything
    # is installed, so that an invalid value fails immediately with a clear
    # message. A step validates one input and reports all the problems of that
    # input, and the first step that fails stops the action
    # enable-cache must be 'true', 'false' or 'auto'
    - name: Validate enable-cache
      shell: bash
      env:
        ENABLE_CACHE: ${{ inputs.enable-cache }}
      run: |
        if [ "${ENABLE_CACHE}" != "true" ] && [ "${ENABLE_CACHE}" != "false" ] &&
          [ "${ENABLE_CACHE}" != "auto" ]; then
          echo "::error title=Invalid input::The input 'enable-cache' must be" \
            "'true', 'false' or 'auto', got '${ENABLE_CACHE}'."
          exit 1
        fi

    # Step 1.2: Validate working-directory
    # working-directory must be a relative path, without '..', of an existing
    # directory of the workspace
    - name: Validate working-directory
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        absolute_path='^/'
        parent_path='(^|/)\.\.(/|$)'
        if [[ "${WORKING_DIRECTORY}" =~ ${absolute_path} ]]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "must be relative to the workspace, got '${WORKING_DIRECTORY}'."
          exit 1
        elif [[ "${WORKING_DIRECTORY}" =~ ${parent_path} ]]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "must stay inside the workspace, got '${WORKING_DIRECTORY}'."
          exit 1
        elif [ ! -d "${GITHUB_WORKSPACE}/${WORKING_DIRECTORY}" ]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "is not a directory of the workspace: '${WORKING_DIRECTORY}'." \
            "Did you forget the 'actions/checkout' step?"
          exit 1
        fi

    # Step 1.3: Validate the project files
    # 'pyproject.toml', 'uv.lock' and 'tasks.py' must exist in working-directory
    # Without this step, a missing file surfaces as an obscure error from a later
    # step, after uv and Python are installed
    # It runs after step 1.2, so the directory is known to be valid
    - name: Validate the project files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        status=0
        for file in pyproject.toml uv.lock tasks.py; do
          if [ ! -f "${file}" ]; then
            echo "::error title=Missing project file::No '${file}' found in" \
              "'$(pwd)'. See the requirements in the README, and set" \
              "'working-directory' if the project is in a subfolder."
            status=1
          fi
        done
        exit "${status}"

    # Step 1.4: Validate extra-packages
    # extra-packages must contain one requirement per line, not an option (a line
    # that starts with '-', e.g., '--index-url=...' or '-e .')
    - name: Validate extra-packages
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        status=0
        while IFS= read -r line; do
          # Trim the leading whitespace, like the installation step
          line="${line#"${line%%[![:space:]]*}"}"
          if [[ "${line}" == -* ]]; then
            echo "::error title=Invalid input::The input 'extra-packages'" \
              "must contain one requirement per line, not options, got" \
              "'${line}'."
            status=1
          fi
        done <<< "${EXTRA_PACKAGES}"
        exit "${status}"

    # Step 2: Install uv and configure the Python environment
    # Uses the astral-sh/setup-uv action which:
    # - Installs uv (ultra-fast Python package installer and resolver), in the
    #   version of the uv-version input
    # - Sets up the specified Python version
    # - Activates the virtual environment so subsequent steps can use 'python' and 'uv pip'
    # - Restores and saves the uv cache when the enable-cache input allows it
    # The project files are searched in the working-directory input
    - name: Install uv and set the python version
      id: setup-uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        enable-cache: ${{ inputs.enable-cache }}
        activate-environment: true

    # Step 3.1: Read the locked invoke-tasklib version
    # invoke-tasklib provides the invoke tasks used below (env.install)
    # The exact version is read from uv.lock, so that the bootstrap is
    # reproducible and needs no Python before the setup of the environment
    # 'uv export --frozen' neither resolves nor modifies the lock file
    # It fails when invoke-tasklib is not in the lock file of the project
    # The requirement is used in step 3.2
    - name: Read the locked invoke-tasklib version
      id: tasklib
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        requirements="$(uv export --frozen --no-hashes --no-emit-project --all-groups --all-extras)"
        requirement="$(grep -E '^invoke-tasklib==' <<< "${requirements}" | sed -n '1p' | cut -d' ' -f1 || true)"
        if [ -z "${requirement}" ]; then
          echo "::error title=Missing invoke-tasklib::'invoke-tasklib' is not in 'uv.lock'. Add it to a dependency group of 'pyproject.toml' (for example 'dev = [\"invoke-tasklib >=0.0.8,<1.0.0\"]'), then run 'uv lock' and commit the result."
          exit 1
        fi
        echo "requirement=${requirement}" >> "${GITHUB_OUTPUT}"

    # Step 3.2: Install invoke-tasklib
    # It runs in the working-directory input, so that 'uv pip install' reads the
    # 'uv.toml' of the project (e.g., its index settings) like the next steps
    - name: Install invoke-tasklib
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIREMENT: ${{ steps.tasklib.outputs.requirement }}
      run: |
        uv pip install "${REQUIREMENT}"

    # Step 4: Install project dependencies using the env.install task
    # The task is executed in the working-directory input
    # Optional install-args can be passed to customize the installation
    # (e.g., --no-optional-deps to skip installing optional dependencies)
    # The arguments are split on whitespace (no quoting) and are not glob-expanded
    # If the task is missing, 'inv' reports it (No idea what 'env.install' is!)
    # If install-args excludes the group of invoke-tasklib, the action does not
    # need 'inv' after this step, but later steps of the caller may
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        # install-args is split on whitespace but not expanded as a glob
        set -f
        inv env.install ${INSTALL_ARGS}

    # Step 5 (Optional): Install additional packages
    # Only runs if extra-packages is provided, with one requirement per line
    # Useful for tools that are not dependencies of the project (e.g., pytest-xdist)
    # and to test a specific version of a dependency (e.g., numpy==1.26.0)
    # Blank lines are ignored and every line is passed to uv as a single argument
    # A line that starts with '-' is rejected by the validation (step 1.4), so a
    # line is always a requirement and never an option of uv
    - name: Install extra packages
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        packages=()
        while IFS= read -r line; do
          # Trim the leading and trailing whitespace without spawning a process
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          if [ -n "${line}" ]; then
            packages+=("${line}")
          fi
        done <<< "${EXTRA_PACKAGES}"
        if [ "${#packages[@]}" -gt 0 ]; then
          uv pip install "${packages[@]}"
        fi

    # Steps 6.1 to 6.5 report the environment for debugging
    # Each step runs one command, so that a failure never hides the output of the
    # others, and uses continue-on-error so a reporting failure does not fail the
    # action. They always run
    # Step 6.1: Show the versions of uv and python
    # Shows which python is active (the virtual environment of the project)
    - name: Show the versions
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv --version
        which python
        python --version

    # Step 6.2: Show the Python interpreters managed by uv
    - name: Show the Python interpreters
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv python list --only-installed

    # Step 6.3: Show all the installed packages with their versions
    # Helpful for debugging dependency issues and verifying installations
    - name: Show the installed packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv pip list

    # Step 6.4: Show the dependency tree with the version constraints
    # Shows the direct and transitive dependencies with their specifiers
    # (e.g., >=1.0.0, <2.0), to understand dependency relationships and conflicts
    - name: Show the dependency tree
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv pip tree --show-version-specifiers

    # Step 6.5: Check the environment
    # Runs 'uv pip check' to detect missing dependencies, version conflicts and
    # broken installations. The conflicts are logged but do not fail the action
    - name: Check the environment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv pip check

    # Step 7: Set the outputs of the action
    # Reads the version from the interpreter that is active at the end of the
    # action (after the dependencies are installed), not from the requested input
    # 'uv python find' returns the interpreter of the active virtual environment,
    # and the version is read before writing the output so that a failure fails
    # the step instead of silently setting an empty output
    # It runs in the working-directory input, like the other steps that use uv,
    # so that the interpreter is found in the same project as the install
    - name: Set outputs
      id: python-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python_bin="$(uv python find)"
        python_version="$("${python_bin}" -c 'import platform; print(platform.python_version())')"
        echo "python-version=${python_version}" >> "${GITHUB_OUTPUT}"
