name: "Setup venv with uv"
description: "Setup a Python virtual environment and install the project dependencies using uv"

author: "Thibaut Durand"

branding:
  icon: "layers"
  color: "blue"

inputs:
  python-version:
    default: ""
    description: "Python version to use (e.g., '3.13', '3.12', '3.11', '3.10') or any version request supported by uv (e.g., '>=3.12,<3.14'). Leave empty (default) to let uv follow the project: the '.python-version' file, then 'requires-python' of 'pyproject.toml'."
    required: false
  uv-version:
    default: ""
    description: "Version of uv to install (e.g., '0.9.0', '0.9.x', '>=0.9,<0.10' or 'latest'). Leave empty to use the 'required-version' of the project ('uv.toml' or 'pyproject.toml') if any, and the latest version otherwise."
    required: false
  package-name:
    default: ""
    description: "Optional package name to install for dependency compatibility testing. Use with 'package-version' to test specific versions. Leave empty to skip."
    required: false
  package-version:
    default: ""
    description: "Optional package version to install (e.g., '1.0.0'). It must be a version, not a specifier (e.g., '>=1.0' is rejected). Only used when 'package-name' is specified. Leave empty to install the latest version."
    required: false
  install-args:
    default: ""
    description: "Optional arguments passed to the 'inv env.install' command (e.g., '--no-optional-deps', '--groups=dev,docs', or custom flags supported by your invoke-tasklib configuration). The value is split on whitespace: quotes are not interpreted and glob characters are kept as is."
    required: false
  package-install-args:
    default: ""
    description: "Optional arguments passed to the 'uv pip install' command used to install 'package-name' (e.g., '--upgrade'). Relative paths start at the workspace root, not at 'working-directory'."
    required: false
  extra-packages:
    default: ""
    description: "Optional additional packages to install after the project dependencies, one requirement per line (e.g., 'pytest-xdist' or 'requests>=2.31'). A line cannot be an option: it must not start with '-'. Leave empty to skip."
    required: false
  enable-cache:
    default: "auto"
    description: "Enable the GitHub Actions cache of uv ('true', 'false' or 'auto'). 'auto' (default) enables the cache on GitHub-hosted runners and disables it elsewhere, like astral-sh/setup-uv. The cache is keyed on the lock files of the project."
    required: false
  working-directory:
    default: "."
    description: "Directory that contains the project ('pyproject.toml', 'tasks.py', 'invoke.yaml'), relative to the workspace. Use it for repositories where the Python project is in a subfolder."
    required: false

outputs:
  cache-hit:
    description: "Whether the uv cache was restored ('true' or 'false'). Empty when the cache is disabled."
    value: ${{ steps.setup-uv.outputs.cache-hit }}
  uv-version:
    description: "Version of uv that was installed (e.g., '0.9.0'). Useful when 'uv-version' is empty or a range."
    value: ${{ steps.setup-uv.outputs.uv-version }}
  python-version:
    description: "Full version of the Python interpreter of the environment (e.g., '3.14.0')."
    value: ${{ steps.python-version.outputs.python-version }}
  package-installed:
    description: "Whether 'package-name' was installed ('true' or 'false'). 'false' when 'package-name' is empty, or when the requested version is not valid for the Python version (the installation is skipped with a warning). Use it to skip the tests of a combination that does not exist."
    value: ${{ steps.python-version.outputs.package-installed }}

runs:
  using: "composite"
  steps:
    # Step 1.1: Validate enable-cache
    # Steps 1.1 to 1.7 validate the inputs and the project files before anything
    # is installed, so that an invalid value fails immediately with a clear
    # message. A step validates one input and reports all the problems of that
    # input, and the first step that fails stops the action
    # enable-cache must be 'true', 'false' or 'auto'
    - name: Validate enable-cache
      shell: bash
      env:
        ENABLE_CACHE: ${{ inputs.enable-cache }}
      run: |
        if [ "${ENABLE_CACHE}" != "true" ] && [ "${ENABLE_CACHE}" != "false" ] &&
          [ "${ENABLE_CACHE}" != "auto" ]; then
          echo "::error title=Invalid input::The input 'enable-cache' must be" \
            "'true', 'false' or 'auto', got '${ENABLE_CACHE}'."
          exit 1
        fi

    # Step 1.2: Validate working-directory
    # working-directory must be a relative path, without '..', of an existing
    # directory of the workspace
    - name: Validate working-directory
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        absolute_path='^/'
        parent_path='(^|/)\.\.(/|$)'
        if [[ "${WORKING_DIRECTORY}" =~ ${absolute_path} ]]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "must be relative to the workspace, got '${WORKING_DIRECTORY}'."
          exit 1
        elif [[ "${WORKING_DIRECTORY}" =~ ${parent_path} ]]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "must stay inside the workspace, got '${WORKING_DIRECTORY}'."
          exit 1
        elif [ ! -d "${GITHUB_WORKSPACE}/${WORKING_DIRECTORY}" ]; then
          echo "::error title=Invalid input::The input 'working-directory'" \
            "is not a directory of the workspace: '${WORKING_DIRECTORY}'." \
            "Did you forget the 'actions/checkout' step?"
          exit 1
        fi

    # Step 1.3: Validate the project files
    # 'pyproject.toml', 'uv.lock' and 'tasks.py' must exist in working-directory
    # Without this step, a missing file surfaces as an obscure error from a later
    # step, after uv and Python are installed
    # It runs after step 1.2, so the directory is known to be valid
    - name: Validate the project files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        status=0
        for file in pyproject.toml uv.lock tasks.py; do
          if [ ! -f "${file}" ]; then
            echo "::error title=Missing project file::No '${file}' found in" \
              "'$(pwd)'. See the requirements in the README, and set" \
              "'working-directory' if the project is in a subfolder."
            status=1
          fi
        done
        exit "${status}"

    # Step 1.4: Validate extra-packages
    # extra-packages must contain one requirement per line, not an option (a line
    # that starts with '-', e.g., '--index-url=...' or '-e .')
    - name: Validate extra-packages
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        status=0
        while IFS= read -r line; do
          # Trim the leading whitespace, like the installation step
          line="${line#"${line%%[![:space:]]*}"}"
          if [[ "${line}" == -* ]]; then
            echo "::error title=Invalid input::The input 'extra-packages'" \
              "must contain one requirement per line, not options, got" \
              "'${line}'."
            status=1
          fi
        done <<< "${EXTRA_PACKAGES}"
        exit "${status}"

    # Step 1.5: Validate package-name
    # package-name must be a package name, optionally followed by extras
    # (e.g., 'numpy' or 'uvicorn[standard]'), not an option or a requirement
    - name: Validate package-name
      if: ${{ inputs.package-name != '' }}
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        distribution='[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?'
        extras='(\[[A-Za-z0-9._,-]+\])?'
        package_name="^${distribution}${extras}\$"
        if ! [[ "${PACKAGE_NAME}" =~ ${package_name} ]]; then
          echo "::error title=Invalid input::The input 'package-name' must be" \
            "a package name, optionally followed by extras (e.g., 'numpy' or" \
            "'uvicorn[standard]'), got '${PACKAGE_NAME}'. The version goes in" \
            "'package-version' and the options in 'package-install-args'."
          exit 1
        fi

    # Step 1.6: Validate package-version
    # package-version must be a version, not a specifier (e.g., '1.26.0' or
    # '2.12.*', not '>=1.0' or '1.0 --pre'): it is installed as
    # 'package-name==package-version'
    # It is ignored without package-name (see step 1.7)
    - name: Validate package-version
      if: ${{ inputs.package-name != '' && inputs.package-version != '' }}
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        package_version='^v?[0-9][0-9A-Za-z.!+*_-]*$'
        if ! [[ "${PACKAGE_VERSION}" =~ ${package_version} ]]; then
          echo "::error title=Invalid input::The input 'package-version'" \
            "must be a version (e.g., '1.26.0' or '2.12.*'), not a" \
            "specifier or an option, got '${PACKAGE_VERSION}'. The options" \
            "go in 'package-install-args'."
          exit 1
        fi

    # Step 1.7: Warn about the ignored package inputs
    # package-version and package-install-args are ignored without package-name
    - name: Warn about ignored package inputs
      if: ${{ inputs.package-name == '' && (inputs.package-version != '' || inputs.package-install-args != '') }}
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
        PACKAGE_INSTALL_ARGS: ${{ inputs.package-install-args }}
      run: |
        if [ -n "${PACKAGE_VERSION}" ]; then
          echo "::warning title=Ignored input::The input 'package-version' is ignored because 'package-name' is empty."
        fi
        if [ -n "${PACKAGE_INSTALL_ARGS}" ]; then
          echo "::warning title=Ignored input::The input 'package-install-args' is ignored because 'package-name' is empty."
        fi

    # Step 2: Install uv and configure the Python environment
    # Uses the astral-sh/setup-uv action which:
    # - Installs uv (ultra-fast Python package installer and resolver), in the
    #   version of the uv-version input
    # - Sets up the specified Python version. When the python-version input is
    #   empty (default), uv follows the project: '.python-version', then
    #   'requires-python' of 'pyproject.toml', in the working-directory input
    # - Activates the virtual environment so subsequent steps can use 'python' and 'uv pip'
    # - Restores and saves the uv cache when the enable-cache input allows it
    # The project files are searched in the working-directory input
    - name: Install uv and set the python version
      id: setup-uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
        enable-cache: ${{ inputs.enable-cache }}
        activate-environment: true

    # Step 3.1: Read the locked invoke-tasklib version
    # invoke-tasklib provides the invoke tasks used below (env.install)
    # The exact version is read from uv.lock, so that the bootstrap is
    # reproducible and needs no Python before the setup of the environment
    # 'uv export --frozen' neither resolves nor modifies the lock file
    # The export is assigned on its own line, so that a failure of uv fails the
    # step (the failure is not hidden by the search of the requirement)
    # It fails when invoke-tasklib is not in the lock file of the project
    # The requirement is used in step 3.2
    - name: Read the locked invoke-tasklib version
      id: tasklib
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        requirements="$(uv export --frozen --no-hashes --no-emit-project --all-groups --all-extras)"
        requirement="$(awk '/^invoke-tasklib==/ { print $1; exit }' <<< "${requirements}")"
        if [ -z "${requirement}" ]; then
          echo "::error title=Missing invoke-tasklib::'invoke-tasklib' is not in 'uv.lock'. Add it to a dependency group of 'pyproject.toml' (for example 'dev = [\"invoke-tasklib >=0.0.8,<1.0.0\"]'), then run 'uv lock' and commit the result."
          exit 1
        fi
        echo "requirement=${requirement}" >> "${GITHUB_OUTPUT}"

    # Step 3.2: Install invoke-tasklib
    # It runs in the working-directory input, so that 'uv pip install' reads the
    # 'uv.toml' of the project (e.g., its index settings) like the next steps
    - name: Install invoke-tasklib
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUIREMENT: ${{ steps.tasklib.outputs.requirement }}
      run: |
        uv pip install "${REQUIREMENT}"

    # Step 4: Install project dependencies using the env.install task
    # The task is executed in the working-directory input
    # Optional install-args can be passed to customize the installation
    # (e.g., --no-optional-deps to skip installing optional dependencies)
    # The arguments are split on whitespace (no quoting) and are not glob-expanded
    # If the task is missing, 'inv' reports it (No idea what 'env.install' is!)
    # If install-args excludes the group of invoke-tasklib, the action does not
    # need 'inv' after this step, but later steps of the caller may
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        # install-args is split on whitespace but not expanded as a glob
        set -f
        inv env.install ${INSTALL_ARGS}

    # Step 5.1 (Optional): Install the latest version or a wildcard version of a package
    # Only runs if package-name is provided and package-version is empty or has
    # a wildcard (e.g., '2.12.*'): uv-install-package-action (step 5.2) only
    # accepts a concrete version, and checks it against the Python version
    # The requirement is passed to uv, which resolves the version: an
    # installation that fails fails the step
    # package-install-args is split on whitespace, like install-args (step 4)
    - name: Install latest or wildcard package version
      id: package-direct
      if: ${{ inputs.package-name != '' && (inputs.package-version == '' || contains(inputs.package-version, '*')) }}
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        INSTALL_ARGS: ${{ inputs.package-install-args }}
      run: |
        requirement="${PACKAGE_NAME}"
        if [ -n "${PACKAGE_VERSION}" ]; then
          requirement="${PACKAGE_NAME}==${PACKAGE_VERSION}"
        fi
        set -f
        uv pip install "${requirement}" ${INSTALL_ARGS}
        echo "installed=true" >> "${GITHUB_OUTPUT}"

    # Step 5.2 (Optional): Install a specific package version for compatibility testing
    # Only runs if package-name is provided and package-version is a concrete version
    # Useful for testing your project against different versions of a dependency
    # (e.g., test against numpy 1.24.0, 1.25.0, etc. in a matrix strategy)
    # This step runs in the workspace root, not in the working-directory input:
    # uv-install-package-action has no working-directory input and a step that
    # uses an action cannot set one, so the relative paths of the
    # package-install-args input start at the workspace root
    # The python-version input is not forwarded: uv-install-package-action only
    # accepts 'X.Y' versions, whereas python-version can be any uv version
    # request (e.g., '>=3.12'). It detects the version of the active interpreter
    # Its is-valid-version output is false when the requested version does not
    # exist for the Python version: the installation is then skipped and the
    # step succeeds. A failed installation fails the step, so the action fails
    # (step 8 sets the package-installed output from is-valid-version)
    - name: Install specific package version
      id: package
      if: ${{ inputs.package-name != '' && inputs.package-version != '' && !contains(inputs.package-version, '*') }}
      uses: durandtibo/uv-install-package-action@fe64eac38f69e851b5e79b74ee255ed95a159bc0 # ratchet:durandtibo/uv-install-package-action@v0.2.0
      with:
        package-name: ${{ inputs.package-name }}
        package-version: ${{ inputs.package-version }}
        uv-args: ${{ inputs.package-install-args }}

    # Step 6 (Optional): Install additional packages
    # Only runs if extra-packages is provided, with one requirement per line
    # Useful for tools that are not dependencies of the project (e.g., pytest-xdist)
    # Blank lines are ignored and every line is passed to uv as a single argument
    # A line that starts with '-' is rejected by the validation (step 1.4), so a
    # line is always a requirement and never an option of uv
    - name: Install extra packages
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        packages=()
        while IFS= read -r line; do
          # Trim the leading and trailing whitespace without spawning a process
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          if [ -n "${line}" ]; then
            packages+=("${line}")
          fi
        done <<< "${EXTRA_PACKAGES}"
        if [ "${#packages[@]}" -gt 0 ]; then
          uv pip install "${packages[@]}"
        fi

    # Steps 7.1 to 7.4 report the environment for debugging
    # Each step runs one command, so that a failure never hides the output of the
    # others, and uses continue-on-error so a reporting failure does not fail the
    # action. They always run
    # Step 7.1: Show the versions of uv and python
    # Shows which python is active (the virtual environment of the project)
    - name: Show the versions
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv --version
        which python
        python --version

    # Step 7.2: Show all the installed packages with their versions
    # Helpful for debugging dependency issues and verifying installations
    - name: Show the installed packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv pip list

    # Step 7.3: Show the dependency tree with the version constraints
    # Shows the direct and transitive dependencies with their specifiers
    # (e.g., >=1.0.0, <2.0), to understand dependency relationships and conflicts
    - name: Show the dependency tree
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv pip tree --show-version-specifiers

    # Step 7.4: Check the environment
    # Runs 'uv pip check' to detect missing dependencies, version conflicts and
    # broken installations. The conflicts are logged but do not fail the action
    - name: Check the environment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        uv pip check

    # Step 8: Set the outputs of the action
    # Reads the version from the interpreter that is active at the end of the
    # action (after the dependencies are installed), not from the requested input
    # 'python' is the interpreter of the virtual environment (activated by
    # setup-uv), and the version is read before writing the output so that a
    # failure fails the step instead of silently setting an empty output
    # It runs in the working-directory input, like the other steps, so that the
    # interpreter is found in the same project as the install
    # package-installed is true only when the package step reports a valid
    # version (the output is empty when the step did not run, hence 'false')
    - name: Set outputs
      id: python-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_VALID: ${{ steps.package.outputs.is-valid-version }}
        PACKAGE_DIRECT: ${{ steps.package-direct.outputs.installed }}
      run: |
        python_version="$(python -c 'import platform; print(platform.python_version())')"
        echo "python-version=${python_version}" >> "${GITHUB_OUTPUT}"
        echo "package-installed=${PACKAGE_DIRECT:-${PACKAGE_VALID:-false}}" >> "${GITHUB_OUTPUT}"
