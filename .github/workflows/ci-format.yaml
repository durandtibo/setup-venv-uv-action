# Formatting and linting workflow.
# Checks that the YAML, Makefile, shell and Markdown files follow the repo's formatting rules,
# and that the README documents the inputs and outputs of action.yaml.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Format
        run: |
          make format

      - name: Check for changes
        run: |
          git diff --exit-code

      - name: Lint Markdown files
        run: |
          make lint-markdown

      - name: Lint shell scripts
        run: |
          make lint-shell

      - name: Lint YAML files
        run: |
          make lint-yaml

      - name: Check that the README documents the inputs and outputs
        run: |
          make check-readme
