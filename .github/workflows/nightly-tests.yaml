# Runs the tests of the local and the stable action daily to catch issues from
# external updates (uv, setup-uv, invoke-tasklib) early. The format check is not
# run: formatting does not change with time.

name: Nightly Tests
on:
  schedule:
    - cron: "0 9 * * *" # run at 9:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  actions: write
  contents: read

jobs:
  test-local:
    uses: ./.github/workflows/test-local.yaml
  test-stable:
    uses: ./.github/workflows/test-stable.yaml
