# Tests the action using the current repository code (uses: ./) across Linux/macOS,
# python/install/package input variants. Validates uncommitted changes before release.

name: Test Local Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  actions: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      os_unix: ${{ steps.cfg.outputs.os_unix }}
      python_versions: ${{ steps.cfg.outputs.python_versions_standard }}
    steps:
      - name: Load workflow config
        uses: durandtibo/workflow-config-action@8c406999ac8ac3cafe656c263759d8ddea3a4edb # ratchet:durandtibo/workflow-config-action@v0.2
        id: cfg

  test:
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_unix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python --version | grep -q "3\.14\." || (echo "expected default python 3.14.x" && exit 1)
          # the virtual environment must be active
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv not active'"
          # no package should be installed when 'package-name' is empty
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy should not be installed'"
          # the environment must be consistent
          uv pip check

  test-python-version:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        id: setup
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test environment
        env:
          EXPECTED_VERSION: ${{ matrix.python-version }}
          OUTPUT_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          python --version
          python -c "import myproject; print(myproject)"
          python -c "import sys, os; v = os.environ['EXPECTED_VERSION']; assert f'{sys.version_info[0]}.{sys.version_info[1]}' == v, sys.version"
          python -c "import platform, os; v = os.environ['OUTPUT_VERSION']; assert v == platform.python_version(), v"

  test-install-args:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          install-args: "--no-optional-deps"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy
          package-version: 2.4.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"

  test-package-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; print(numpy.__version__)"

  test-package-args:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy
          package-version: 2.4.0
          package-install-args: "--dry-run"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          # '--dry-run' is passed to 'uv pip install': nothing is installed,
          # whereas test-package installs numpy without it
          python -c "
          import importlib.util as u
          assert not u.find_spec('numpy'), 'numpy should not be installed'
          "

  test-package-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: "requests[socks]"
          package-version: 2.32.5

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import requests; assert requests.__version__ == '2.32.5'"
          # PySocks is only installed with the 'socks' extra
          python -c "import socks"

  test-tasklib-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          invoke-tasklib-version: "==0.0.8"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          uv pip show invoke-tasklib | grep -q "^Version: 0\.0\.8$" || (echo "expected invoke-tasklib 0.0.8" && exit 1)

  test-tasklib-version-unsatisfiable:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment with an unsatisfiable invoke-tasklib version
        id: setup
        uses: ./
        continue-on-error: true
        with:
          invoke-tasklib-version: ">=999.0.0"

      - name: Test that the action failed while installing invoke-tasklib
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
          # uv and the virtual environment (step 5) are available: the failure
          # is not in the first steps
          uv --version
          python --version
          # invoke-tasklib could not be installed: step 7 failed
          if uv pip show --quiet invoke-tasklib; then
            echo "invoke-tasklib is installed: the failure is not in step 7"
            exit 1
          fi
          # the dependencies were not installed: step 9 did not run
          if python -c "import myproject" 2> /dev/null; then
            echo "myproject is installed: the action did not stop earlier"
            exit 1
          fi

  test-working-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Move the project to a subfolder
        run: |
          mkdir subproject
          mv pyproject.toml uv.lock tasks.py invoke.yaml src subproject/

      - name: Setup python environment
        id: setup
        uses: ./
        with:
          working-directory: subproject

      - name: Test environment
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import sys; assert sys.prefix.endswith('/subproject/.venv'), sys.prefix"
          # the output is the version of the interpreter of the subproject
          python -c "
          import os, platform
          v = os.environ['OUTPUT_VERSION']
          assert v == platform.python_version(), v
          "

  test-missing-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Remove tasks.py
        run: |
          rm tasks.py

      - name: Setup python environment without tasks.py
        id: setup
        uses: ./
        continue-on-error: true

      - name: Test that the action failed while verifying the project tasks
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
          # uv and the virtual environment (step 5) are available: the failure
          # is not in the first steps
          uv --version
          python --version
          # invoke-tasklib was installed (step 7): the failure is in step 8
          if ! uv pip show --quiet invoke-tasklib; then
            echo "invoke-tasklib is not installed: the action failed too early"
            exit 1
          fi
          # the dependencies were not installed: step 9 did not run
          if python -c "import myproject" 2> /dev/null; then
            echo "myproject is installed: the action did not stop earlier"
            exit 1
          fi

  test-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        enable-cache: ["true", "false"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        id: setup
        uses: ./
        with:
          enable-cache: ${{ matrix.enable-cache }}

      - name: Test environment
        env:
          ENABLE_CACHE: ${{ matrix.enable-cache }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          python -c "import myproject; print(myproject)"
          echo "cache-hit='${CACHE_HIT}'"
          if [ "${ENABLE_CACHE}" = "true" ]; then
            # the cache is enabled: the output reports whether it was restored
            [ "${CACHE_HIT}" = "true" ] || [ "${CACHE_HIT}" = "false" ] || (echo "expected cache-hit to be true or false" && exit 1)
          else
            # the cache is disabled: it cannot be restored
            [ "${CACHE_HIT}" != "true" ] || (echo "expected no cache hit when the cache is disabled" && exit 1)
          fi

  test-extra-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          extra-packages: |
            six==1.17.0

            attrs>=24.0
              iniconfig

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import importlib.metadata as m; assert m.version('six') == '1.17.0', m.version('six')"
          python -c "import attr, iniconfig; print(attr.__version__)"

  test-not-verbose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          verbose: "false"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          uv pip check

  test-invalid-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Test that uv is not installed before the action
        run: |
          if command -v uv; then
            echo "uv is already installed, the test is not valid"
            exit 1
          fi

      - name: Setup python environment with an invalid uv-no-progress
        id: uv-no-progress
        uses: ./
        continue-on-error: true
        with:
          uv-no-progress: "yes"

      - name: Setup python environment with an invalid verbose
        id: verbose
        uses: ./
        continue-on-error: true
        with:
          verbose: "1"

      - name: Setup python environment with an invalid enable-cache
        id: enable-cache
        uses: ./
        continue-on-error: true
        with:
          enable-cache: "maybe"

      - name: Setup python environment with an invalid invoke-tasklib-version
        id: tasklib-version
        uses: ./
        continue-on-error: true
        with:
          invoke-tasklib-version: "0.0.8"

      - name: Setup python environment with an invalid package-name
        id: package-name
        uses: ./
        continue-on-error: true
        with:
          package-name: "--upgrade"
          package-version: 2.4.0

      - name: Test that the actions failed in the validation
        env:
          OUTCOME_UV_NO_PROGRESS: ${{ steps.uv-no-progress.outcome }}
          OUTCOME_VERBOSE: ${{ steps.verbose.outcome }}
          OUTCOME_ENABLE_CACHE: ${{ steps.enable-cache.outcome }}
          OUTCOME_TASKLIB_VERSION: ${{ steps.tasklib-version.outcome }}
          OUTCOME_PACKAGE_NAME: ${{ steps.package-name.outcome }}
        run: |
          for outcome in \
            "${OUTCOME_UV_NO_PROGRESS}" \
            "${OUTCOME_VERBOSE}" \
            "${OUTCOME_ENABLE_CACHE}" \
            "${OUTCOME_TASKLIB_VERSION}" \
            "${OUTCOME_PACKAGE_NAME}"; do
            test "${outcome}" = "failure" || (echo "expected the action to fail, got '${outcome}'" && exit 1)
          done
          # the validation (steps 1 to 4) failed: uv was not installed yet
          if command -v uv; then
            echo "uv is installed: the action did not fail in the validation"
            exit 1
          fi

  test-ignored-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment with inputs that are ignored without package-name
        uses: ./
        with:
          package-version: 2.4.0
          package-install-args: "--upgrade"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy should not be installed'"

  test-progress-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          uv-no-progress: "false"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-tasklib-not-a-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Remove invoke-tasklib from the project dependencies
        run: |
          pipx run uv remove --no-sync --group dev invoke-tasklib

      - name: Setup python environment
        uses: ./

      - name: Test environment
        run: |
          # the action succeeds: only the diagnostic steps fail
          python -c "import myproject; print(myproject)"
          # invoke-tasklib is not a dependency of the project: sync removed it
          python -c "import importlib.util as u; assert u.find_spec('invoke_tasklib') is None"

  test-package-python-specifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment with a Python version range
        uses: ./
        with:
          python-version: ">=3.12,<3.14"
          package-name: numpy
          package-version: 2.4.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import sys; assert (3, 12) <= sys.version_info[:2] < (3, 14), sys.version"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"

  test-invalid-working-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Test that uv is not installed before the action
        run: |
          if command -v uv; then
            echo "uv is already installed, the test is not valid"
            exit 1
          fi

      - name: Copy the project outside of the workspace
        run: |
          cp -r . ../outside-project

      - name: Setup python environment with a project outside of the workspace
        id: outside
        uses: ./
        continue-on-error: true
        with:
          working-directory: ../outside-project

      - name: Setup python environment with an absolute path
        id: absolute
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ github.workspace }}

      - name: Setup python environment with a missing directory
        id: missing
        uses: ./
        continue-on-error: true
        with:
          working-directory: missing-directory

      - name: Test that the actions failed in the validation
        env:
          OUTCOME_OUTSIDE: ${{ steps.outside.outcome }}
          OUTCOME_ABSOLUTE: ${{ steps.absolute.outcome }}
          OUTCOME_MISSING: ${{ steps.missing.outcome }}
        run: |
          for outcome in "${OUTCOME_OUTSIDE}" "${OUTCOME_ABSOLUTE}" "${OUTCOME_MISSING}"; do
            test "${outcome}" = "failure" || (echo "expected the action to fail, got '${outcome}'" && exit 1)
          done
          # the validation (steps 1 to 4) failed: uv was not installed yet
          if command -v uv; then
            echo "uv is installed: the action did not fail in the validation"
            exit 1
          fi

  test-install-args-glob:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create a file that matches the glob pattern of the argument
        run: |
          touch ./--no-optional-deps

      - name: Setup python environment with a glob character in install-args
        id: setup
        uses: ./
        continue-on-error: true
        with:
          install-args: "--no-optional-dep?"

      - name: Test that the argument was not expanded
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          # expanded to the valid flag '--no-optional-deps', the action would succeed;
          # passed as is, 'inv env.install' rejects the unknown flag
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)

  test-uv-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment with a pinned uv version
        id: setup
        uses: ./
        with:
          uv-version: "0.12.0"

      - name: Test environment
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.uv-version }}
        run: |
          python -c "import myproject; print(myproject)"
          uv --version
          # the pinned version is installed, not the latest one
          uv --version | grep -qE "^uv 0\.12\.0( |$)" || (echo "expected uv 0.12.0" && exit 1)
          # the output is the installed version
          test "${OUTPUT_VERSION}" = "0.12.0" || (echo "expected output 0.12.0, got '${OUTPUT_VERSION}'" && exit 1)

  test-working-directory-uv-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Move the project to a subfolder with a restrictive uv.toml
        run: |
          mkdir subproject
          mv pyproject.toml uv.lock tasks.py invoke.yaml src subproject/
          # 'uv pip install' only finds invoke-tasklib if it ignores this file
          printf '[pip]\nno-index = true\n' > subproject/uv.toml

      - name: Setup python environment
        id: setup
        uses: ./
        continue-on-error: true
        with:
          working-directory: subproject

      - name: Test that uv read the uv.toml of the working directory
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [ "${OUTCOME}" != "failure" ]; then
            echo "expected the action to fail, got '${OUTCOME}'"
            exit 1
          fi
          # uv and the virtual environment (step 5) are available: the failure
          # is not in the first steps
          uv --version
          python --version
          # step 7 ran in 'subproject', read its uv.toml and found no index:
          # invoke-tasklib is not installed
          if uv pip show --quiet invoke-tasklib; then
            echo "invoke-tasklib is installed: step 7 ignored the uv.toml"
            exit 1
          fi
          # the dependencies were not installed: step 9 did not run
          if python -c "import myproject" 2> /dev/null; then
            echo "myproject is installed: the action did not stop earlier"
            exit 1
          fi
