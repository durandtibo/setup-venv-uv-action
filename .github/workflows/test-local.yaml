# Tests the action using the current repository code (uses: ./) across Linux/macOS,
# python/install/package input variants. Validates uncommitted changes before release.

name: Test Local Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  actions: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      os_unix: ${{ steps.cfg.outputs.os_unix }}
    steps:
      - name: Load workflow config
        uses: durandtibo/workflow-config-action@8c406999ac8ac3cafe656c263759d8ddea3a4edb # ratchet:durandtibo/workflow-config-action@v0.2
        id: cfg

  test:
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_unix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-python-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          python-version: "3.13"

      - name: Test environment
        run: |
          python --version
          python -c "import myproject; print(myproject)"

  test-install-args:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          install-args: "--no-optional-deps"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy
          package-version: 2.4.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-package-args:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy
          package-version: 2.4.0
          package-install-args: "--upgrade"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-progress-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          uv-no-progress: "false"
