# Workflow testing the latest released action, to catch regressions in what consumers
# pick up. It mirrors the jobs of ci-action.yaml, which tests the current checkout
# instead. Update the pinned release below when a new version is released. A job that
# tests an input added after the pinned release only exists in ci-action.yaml: add
# it here when the release is bumped.

name: Test Released Action

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python --version | grep -q "3\.14\." || (echo "expected default python 3.14.x" && exit 1)
          # the virtual environment must be active
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv not active'"
          # no package should be installed when 'package-name' is empty
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy should not be installed'"
          # the environment must be consistent
          uv pip check

  test-python-version:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test environment
        env:
          EXPECTED_VERSION: ${{ matrix.python-version }}
        run: |
          python --version
          python -c "import myproject; print(myproject)"
          python -c "import sys, os; v = os.environ['EXPECTED_VERSION']; assert f'{sys.version_info[0]}.{sys.version_info[1]}' == v, sys.version"

  test-install-args:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          install-args: "--no-optional-deps"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-package:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: numpy
          package-version: 2.4.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"

  test-package-latest:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: numpy

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; print(numpy.__version__)"

  test-package-args:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: numpy
          package-version: 2.4.0
          package-install-args: "--dry-run"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          # '--dry-run' is passed to 'uv pip install': nothing is installed,
          # whereas test-package installs numpy without it
          python -c "
          import importlib.util as u
          assert not u.find_spec('numpy'), 'numpy should not be installed'
          "

  test-package-extras:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: "requests[socks]"
          package-version: 2.32.5

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import requests; assert requests.__version__ == '2.32.5'"
          # PySocks is only installed with the 'socks' extra
          python -c "import socks"

  test-progress-bar:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          uv-no-progress: "false"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
