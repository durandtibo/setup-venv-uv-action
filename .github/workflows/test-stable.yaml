# Tests the last stable release (durandtibo/setup-venv-uv-action@v0.2.0) across
# Linux/macOS and the inputs of the action. Detects regressions in the published action.
# Generated from test-local.yaml by 'make generate-stable-workflow': do not edit it
# by hand. A job of test-local.yaml that tests an input or a behaviour added after
# the tested release has a '# local-only' comment above it: it is not copied here
# until the release is bumped.

name: Test Stable Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  actions: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      os_unix: ${{ steps.cfg.outputs.os_unix }}
      python_versions: ${{ steps.cfg.outputs.python_versions_standard }}
    steps:
      - name: Load workflow config
        uses: durandtibo/workflow-config-action@8c406999ac8ac3cafe656c263759d8ddea3a4edb # ratchet:durandtibo/workflow-config-action@v0.2
        id: cfg

  test:
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_unix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          # no python-version: uv selects a version that satisfies requires-python
          python -c "import sys; assert sys.version_info >= (3, 10), sys.version"
          # the virtual environment must be active
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv not active'"
          # no package should be installed when 'package-name' is empty
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy should not be installed'"
          # the environment must be consistent
          uv pip check

  test-python-version:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python_versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test environment
        env:
          EXPECTED_VERSION: ${{ matrix.python-version }}
        run: |
          python --version
          python -c "import myproject; print(myproject)"
          python -c "import sys, os; v = os.environ['EXPECTED_VERSION']; assert f'{sys.version_info[0]}.{sys.version_info[1]}' == v, sys.version"

  test-install-args:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          install-args: "--no-optional-deps"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: numpy
          package-version: 2.4.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"

  test-package-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: numpy

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; print(numpy.__version__)"

  test-package-args:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: numpy
          package-version: 2.4.0
          package-install-args: "--dry-run"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          # '--dry-run' is passed to 'uv pip install': nothing is installed,
          # whereas test-package installs numpy without it
          python -c "
          import importlib.util as u
          assert not u.find_spec('numpy'), 'numpy should not be installed'
          "

  test-package-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          package-name: "requests[socks]"
          package-version: 2.32.5

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import requests; assert requests.__version__ == '2.32.5'"
          # PySocks is only installed with the 'socks' extra
          python -c "import socks"

  test-progress-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          uv-no-progress: "false"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
