# Workflow testing the action from the current repository code (uses: ./), i.e. the
# version not released yet, on multiple operating systems and Python versions.
# Called from ci.yaml with the test matrix loaded once by lib-get-test-matrix.yaml.

name: Test Action

on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python --version | grep -q "3\.14\." || (echo "expected default python 3.14.x" && exit 1)
          # the virtual environment must be active
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv not active'"
          # no package should be installed when 'package-name' is empty
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy should not be installed'"
          # the environment must be consistent
          uv pip check

  test-python-version:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        id: setup
        uses: ./
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test environment
        env:
          EXPECTED_VERSION: ${{ matrix.python-version }}
          OUTPUT_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          python --version
          python -c "import myproject; print(myproject)"
          python -c "import sys, os; v = os.environ['EXPECTED_VERSION']; assert f'{sys.version_info[0]}.{sys.version_info[1]}' == v, sys.version"
          python -c "import platform, os; v = os.environ['OUTPUT_VERSION']; assert v == platform.python_version(), v"

  test-python-version-file:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set the Python version of the project
        env:
          PROJECT_VERSION: ${{ matrix.python-version }}
        run: |
          echo "${PROJECT_VERSION}" > .python-version

      # python-version is not set: the default (empty) follows .python-version
      - name: Setup python environment
        id: setup
        uses: ./

      - name: Test that the version of .python-version is used
        env:
          EXPECTED_VERSION: ${{ matrix.python-version }}
          OUTPUT_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import sys, os; v = os.environ['EXPECTED_VERSION']; assert f'{sys.version_info[0]}.{sys.version_info[1]}' == v, sys.version"
          python -c "import platform, os; v = os.environ['OUTPUT_VERSION']; assert v == platform.python_version(), v"

  test-install-args:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          install-args: "--no-optional-deps"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"

  test-package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy
          package-version: 2.4.0

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"

  test-package-latest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import numpy; print(numpy.__version__)"

  test-package-args:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: numpy
          package-version: 2.4.0
          package-install-args: "--dry-run"

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          # '--dry-run' is passed to 'uv pip install': nothing is installed,
          # whereas test-package installs numpy without it
          python -c "
          import importlib.util as u
          assert not u.find_spec('numpy'), 'numpy should not be installed'
          "

  test-package-extras:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          package-name: "requests[socks]"
          package-version: 2.32.5

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import requests; assert requests.__version__ == '2.32.5'"
          # PySocks is only installed with the 'socks' extra
          python -c "import socks"

  test-tasklib-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lock a pinned invoke-tasklib version in the project
        run: |
          pipx run uv add --no-sync --group dev "invoke-tasklib==0.0.8"

      - name: Setup python environment
        uses: ./

      - name: Test that the version of uv.lock is installed
        run: |
          python -c "import myproject; print(myproject)"
          uv pip show invoke-tasklib | grep -q "^Version: 0\.0\.8$" || (echo "expected the locked invoke-tasklib 0.0.8" && exit 1)

  test-tasklib-missing:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Remove invoke-tasklib from the project dependencies
        run: |
          pipx run uv remove --no-sync --group dev invoke-tasklib

      - name: Setup python environment without invoke-tasklib in uv.lock
        id: setup
        uses: ./
        continue-on-error: true

      - name: Test that the action failed while reading the locked version
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
          # uv and the virtual environment (step 2) are available: the failure
          # is not in the validation
          uv --version
          python --version
          # nothing was installed: step 3.1 failed, before steps 3.2 and 4
          if uv pip show --quiet invoke-tasklib; then
            echo "invoke-tasklib is installed: the failure is not in step 3.1"
            exit 1
          fi
          if python -c "import myproject" 2> /dev/null; then
            echo "myproject is installed: the action did not stop earlier"
            exit 1
          fi

  test-working-directory:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Move the project to a subfolder
        run: |
          mkdir subproject
          mv pyproject.toml uv.lock tasks.py invoke.yaml src subproject/

      - name: Setup python environment
        id: setup
        uses: ./
        with:
          working-directory: subproject

      - name: Test environment
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.python-version }}
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import sys; assert sys.prefix.endswith('/subproject/.venv'), sys.prefix"
          # the output is the version of the interpreter of the subproject
          python -c "
          import os, platform
          v = os.environ['OUTPUT_VERSION']
          assert v == platform.python_version(), v
          "

  test-missing-files:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        file: ["pyproject.toml", "uv.lock", "tasks.py"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Test that uv is not installed before the action
        run: |
          if command -v uv; then
            echo "uv is already installed, the test is not valid"
            exit 1
          fi

      - name: Remove a project file
        env:
          MISSING_FILE: ${{ matrix.file }}
        run: |
          rm "${MISSING_FILE}"

      - name: Setup python environment without a project file
        id: setup
        uses: ./
        continue-on-error: true

      - name: Test that the action failed in the validation
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
          # the validation (step 1.3) failed: uv was not installed yet
          if command -v uv; then
            echo "uv is installed: the action did not fail in the validation"
            exit 1
          fi

  test-cache:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        enable-cache: ["true", "false", "auto"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        id: setup
        uses: ./
        with:
          enable-cache: ${{ matrix.enable-cache }}

      - name: Test environment
        env:
          ENABLE_CACHE: ${{ matrix.enable-cache }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          python -c "import myproject; print(myproject)"
          echo "cache-hit='${CACHE_HIT}'"
          if [ "${ENABLE_CACHE}" = "true" ] || [ "${ENABLE_CACHE}" = "auto" ]; then
            # the cache is enabled ('auto' enables it on GitHub-hosted runners):
            # the output reports whether it was restored
            [ "${CACHE_HIT}" = "true" ] || [ "${CACHE_HIT}" = "false" ] || (echo "expected cache-hit to be true or false" && exit 1)
          else
            # the cache is disabled: it cannot be restored
            [ "${CACHE_HIT}" != "true" ] || (echo "expected no cache hit when the cache is disabled" && exit 1)
          fi

  test-extra-packages:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./
        with:
          extra-packages: |
            six==1.17.0

            attrs>=24.0
              iniconfig

      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          python -c "import importlib.metadata as m; assert m.version('six') == '1.17.0', m.version('six')"
          python -c "import attr, iniconfig; print(attr.__version__)"

  test-invalid-inputs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: enable-cache, enable-cache: "maybe" }
          - { name: enable-cache-case, enable-cache: "True" }
          - {
              name: working-directory-file,
              working-directory: "pyproject.toml",
            }
          - {
              name: working-directory-inner-parent,
              working-directory: "src/../..",
            }
          - { name: working-directory-only-parent, working-directory: ".." }
          - {
              name: extra-packages-requirements-file,
              extra-packages: "-r requirements.txt",
            }
          - { name: package-name-version, package-name: "numpy==2.4.0" }
          - { name: package-name-space, package-name: "numpy 2.4.0" }
          - { name: package-name-path, package-name: "-e ." }
          - {
              name: package-version-injection,
              package-name: "numpy",
              package-version: "2.4.0; echo injected",
            }
          - { name: working-directory-absolute, working-directory: "/tmp" }
          - { name: working-directory-parent, working-directory: "../project" }
          - {
              name: working-directory-missing,
              working-directory: "missing-directory",
            }
          - {
              name: extra-packages-option,
              extra-packages: "six==1.17.0\n--index-url=https://example.invalid/simple",
            }
          - {
              name: extra-packages-indented-option,
              extra-packages: "six==1.17.0\n  -e .",
            }
          - {
              name: package-name-option,
              package-name: "--upgrade",
              package-version: "2.4.0",
            }
          - {
              name: package-version-specifier,
              package-name: "numpy",
              package-version: ">=2.0",
            }
          - {
              name: package-version-option,
              package-name: "numpy",
              package-version: "2.4.0 --pre",
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Test that uv is not installed before the action
        run: |
          if command -v uv; then
            echo "uv is already installed, the test is not valid"
            exit 1
          fi
      - name: Setup python environment with an invalid input (${{ matrix.name }})
        id: setup
        uses: ./
        continue-on-error: true
        with:
          enable-cache: ${{ matrix.enable-cache || 'auto' }}
          working-directory: ${{ matrix.working-directory || '.' }}
          extra-packages: ${{ matrix.extra-packages }}
          package-name: ${{ matrix.package-name }}
          package-version: ${{ matrix.package-version }}
      - name: Test that the action failed in the validation
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
          # the validation failed: uv was not installed yet
          if command -v uv; then
            echo "uv is installed: the action did not fail in the validation"
            exit 1
          fi
  test-ignored-inputs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment with inputs that are ignored without package-name
        uses: ./
        with:
          package-version: 2.4.0
          package-install-args: "--upgrade"
      - name: Test environment

        run: |
          python -c "import myproject; print(myproject)"
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy should not be installed'"
  test-tasklib-not-in-groups:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout

        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment without the dependency groups
        uses: ./
        with:
          # an empty list of groups: invoke-tasklib is not synced from the lock
          install-args: "--groups="
      - name: Test environment
        run: |
          python -c "import myproject; print(myproject)"
          # the environment is consistent whether or not sync kept invoke-tasklib

          uv pip check
  test-package-python-specifier:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    timeout-minutes: 5
    steps:
      - name: Checkout

        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment with a Python version range
        uses: ./
        with:
          python-version: ">=3.12,<3.14"

          package-name: numpy
          package-version: 2.4.0
      - name: Test environment
        run: |

          python -c "import myproject; print(myproject)"
          python -c "import sys; assert (3, 12) <= sys.version_info[:2] < (3, 14), sys.version"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"
  test-install-args-glob:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Create a file that matches the glob pattern of the argument
        run: |

          touch ./--no-optional-deps
      - name: Setup python environment with a glob character in install-args
        id: setup
        uses: ./
        continue-on-error: true

        with:
          install-args: "--no-optional-dep?"
      - name: Test that the argument was not expanded
        env:
          OUTCOME: ${{ steps.setup.outcome }}

        run: |
          # expanded to the valid flag '--no-optional-deps', the action would succeed;
          # passed as is, 'inv env.install' rejects the unknown flag

          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
  test-uv-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment with a pinned uv version
        id: setup

        uses: ./
        with:
          uv-version: "0.12.0"
      - name: Test environment
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.uv-version }}
        run: |
          python -c "import myproject; print(myproject)"

          uv --version
          # the pinned version is installed, not the latest one
          uv --version | grep -qE "^uv 0\.12\.0( |$)" || (echo "expected uv 0.12.0" && exit 1)

          # the output is the installed version
          test "${OUTPUT_VERSION}" = "0.12.0" || (echo "expected output 0.12.0, got '${OUTPUT_VERSION}'" && exit 1)
  test-working-directory-uv-config:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Move the project to a subfolder with a restrictive uv.toml
        run: |
          mkdir subproject

          mv pyproject.toml uv.lock tasks.py invoke.yaml src subproject/
          # 'uv pip install' only finds invoke-tasklib if it ignores this file
          printf '[pip]\nno-index = true\n' > subproject/uv.toml
      - name: Setup python environment
        id: setup

        uses: ./
        continue-on-error: true
        with:
          working-directory: subproject
      - name: Test that uv read the uv.toml of the working directory
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |

          if [ "${OUTCOME}" != "failure" ]; then
            echo "expected the action to fail, got '${OUTCOME}'"
            exit 1
          fi
          # uv and the virtual environment (step 2) are available: the failure
          # is not in the first steps
          uv --version
          python --version
          # step 3.2 ran in 'subproject', read its uv.toml and found no index:
          # invoke-tasklib is not installed

          if uv pip show --quiet invoke-tasklib; then
            echo "invoke-tasklib is installed: step 3.2 ignored the uv.toml"
            exit 1
          fi
          # the dependencies were not installed: step 4 did not run

          if python -c "import myproject" 2> /dev/null; then
            echo "myproject is installed: the action did not stop earlier"
            exit 1

          fi
  test-package-installed:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # installed: the version exists for the Python version
          - package-name: numpy

            package-version: "2.4.0"
            expected: "true"
          # installed: the latest version
          - package-name: numpy
            package-version: ""
            expected: "true"
          # skipped: numpy 1.24 does not exist for Python 3.14, the action succeeds
          - package-name: numpy
            package-version: "1.24.0"
            expected: "false"
          # no package requested
          - package-name: ""
            package-version: ""
            expected: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment
        id: setup
        uses: ./
        with:
          python-version: "3.14"
          package-name: ${{ matrix.package-name }}

          package-version: ${{ matrix.package-version }}
      - name: Test the package-installed output
        env:
          EXPECTED: ${{ matrix.expected }}
          PACKAGE_INSTALLED: ${{ steps.setup.outputs.package-installed }}
        run: |
          python -c "import myproject; print(myproject)"
          test "${PACKAGE_INSTALLED}" = "${EXPECTED}" || (echo "expected package-installed '${EXPECTED}', got '${PACKAGE_INSTALLED}'" && exit 1)
          # the output matches what is installed
          python -c "
          import importlib.util, os
          installed = importlib.util.find_spec('numpy') is not None
          assert installed == (os.environ['EXPECTED'] == 'true'), installed
          "
  test-python-version-invalid:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # python-version is not validated by the action: uv rejects it
      - name: Setup python environment with a Python version that does not exist
        id: setup

        uses: ./
        continue-on-error: true
        with:
          python-version: "3.99"
      - name: Test that the action failed before installing the project
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || (echo "expected the action to fail, got '${OUTCOME}'" && exit 1)
          if python -c "import myproject" 2> /dev/null; then

            echo "myproject is installed: the action did not stop earlier"
            exit 1
          fi
  test-python-version-no-hint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Remove the .python-version file of the project
        run: |

          rm .python-version
      # no input and no .python-version: uv follows requires-python (>=3.10)
      - name: Setup python environment
        id: setup
        uses: ./

      - name: Test environment
        env:
          OUTPUT_VERSION: ${{ steps.setup.outputs.python-version }}

        run: |
          python -c "import myproject; print(myproject)"
          python -c "import sys; assert sys.version_info[:2] >= (3, 10), sys.version"
          python -c "import platform, os; v = os.environ['OUTPUT_VERSION']; assert v == platform.python_version(), v"
  test-uv-version-range:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { uv-version: "0.12.x", pattern: '^0\.12\.[0-9]+$' }
          - { uv-version: ">=0.11,<0.12", pattern: '^0\.11\.[0-9]+$' }
          - { uv-version: "latest", pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment with a uv version request
        id: setup

        uses: ./
        with:
          uv-version: ${{ matrix.uv-version }}

      - name: Test environment
        env:
          PATTERN: ${{ matrix.pattern }}

          OUTPUT_VERSION: ${{ steps.setup.outputs.uv-version }}
        run: |
          python -c "import myproject; print(myproject)"
          # the output is the resolved version and matches the request

          [[ "${OUTPUT_VERSION}" =~ ${PATTERN} ]] || (echo "unexpected uv-version '${OUTPUT_VERSION}'" && exit 1)
          # the installed uv is the one reported by the output
          uv --version | grep -qE "^uv ${OUTPUT_VERSION//./\\.}( |$)" || (echo "uv does not match '${OUTPUT_VERSION}'" && exit 1)
  test-working-directory-paths:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        working-directory: ["sub/project", "./sub/project/", "my project"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Move the project to the working directory
        env:
          WORKING_DIRECTORY: ${{ matrix.working-directory }}
        run: |

          mkdir -p "${WORKING_DIRECTORY}"
          mv pyproject.toml uv.lock tasks.py invoke.yaml src .python-version "${WORKING_DIRECTORY}/"
      - name: Setup python environment

        uses: ./
        with:
          working-directory: ${{ matrix.working-directory }}
      - name: Test environment
        run: |

          python -c "import myproject; print(myproject)"
          python -c "import sys; assert sys.prefix.endswith('/.venv') and not sys.prefix.endswith('/setup-venv-uv-action/.venv'), sys.prefix"
          # nothing was created at the root of the workspace
          test ! -e .venv || (echo "the virtual environment is at the workspace root" && exit 1)
  test-package-version-wildcard:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment with a wildcard package version
        id: setup
        uses: ./
        with:
          python-version: "3.14"
          package-name: numpy
          package-version: "2.4.*"

      - name: Test environment
        env:
          PACKAGE_INSTALLED: ${{ steps.setup.outputs.package-installed }}

        run: |
          python -c "import myproject; print(myproject)"
          test "${PACKAGE_INSTALLED}" = "true" || (echo "expected package-installed true, got '${PACKAGE_INSTALLED}'" && exit 1)
          python -c "import numpy; assert numpy.__version__.startswith('2.4.'), numpy.__version__"
  test-package-and-extra-packages:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment with a package and extra packages
        uses: ./
        with:
          package-name: numpy

          package-version: 2.4.0
          extra-packages: |
            six==1.17.0
      - name: Test environment
        run: |

          python -c "import myproject; print(myproject)"
          python -c "import numpy; assert numpy.__version__ == '2.4.0', numpy.__version__"
          python -c "import importlib.metadata as m; assert m.version('six') == '1.17.0', m.version('six')"

          uv pip check
